# Important Notes:
# Every field you add must be added to buildSrc/src/main/groovy/multiloader-common.gradle expandProps map.

# Project
version=1.3.1
group=com.chillpavz.oredetector
java_version=21

# Common
minecraft_version=1.21.11
mod_name=Ore Detector Reborn
mod_author=restonic4
mod_id=oredetector
license=MIT
credits=Original Ore Detector mod by restonic4. Reborn/1.21.11 port and expansion by chillpavz.
description=Craft handheld detectors and right-click a surface to scan for ore. \nOre Detector Reborn - an unofficial, updated port of restonic4's Ore Detector.
minecraft_version_range=[1.21.11, 1.22)
## This is the version of minecraft that the 'common' project uses, you can find a list of all versions here
## https://projects.neoforged.net/neoforged/neoform
neo_form_version=1.21.11-20251209.172050
# The version of ParchmentMC that is used, see https://parchmentmc.org/docs/getting-started#choose-a-version for new versions
parchment_minecraft=1.21.11
parchment_version=2025.12.20

# Fabric, see https://fabricmc.net/develop/ for new versions
fabric_version=0.139.5+1.21.11
fabric_loader_version=0.18.2

# Forge, see https://files.minecraftforge.net/net/minecraftforge/forge/ for new versions
forge_version=61.0.1
## Accepted Forge builds. Same rule as neoforge_version_range — never "[forge_version,)".
forge_version_range=[61,)
forge_loader_version_range=[61,)

# NeoForge, see https://projects.neoforged.net/neoforged/neoforge for new versions
neoforge_version=21.11.3-beta
## Accepted NeoForge builds. Must NOT be "[neoforge_version,)" — that pins to the exact build we
## compiled against, refusing every earlier build of the same MC version.
neoforge_version_range=[21.11,21.12)
neoforge_loader_version_range=[4,)

# Config. Cloth Config powers the Fabric/NeoForge screens (Mod Menu adds the Fabric button).
# Cloth has NO Forge build past 1.21.3, so the Forge module uses Forge's own ModConfigSpec instead.
cloth_config_version=21.11.153
modmenu_version=17.0.0

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
