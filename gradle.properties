# Important Notes:
# Every field you add must be added to buildSrc/src/main/groovy/multiloader-common.gradle expandProps map.

# Project
version=1.3.0
group=com.chillpavz.oredetector
java_version=21

# Common
minecraft_version=1.21.1
mod_name=Ore Detector Reborn
mod_author=restonic4
mod_id=oredetector
license=MIT
credits=Original Ore Detector mod by restonic4. Reborn/1.21.1 port and expansion by chillpavz.
description=Craft handheld detectors and right-click a surface to scan for ore. \nOre Detector Reborn - an unofficial, updated port of restonic4's Ore Detector.
## Kept narrow until 1.21.1 is verified in game; widening to cover 1.21 means editing all four ranges
## below (see ../CLAUDE.md "One jar for a whole patch line").
minecraft_version_range=[1.21.1, 1.22)
fabric_minecraft_version_range=>=1.21.1 <1.22
## This is the version of minecraft that the 'common' project uses, you can find a list of all versions here
## https://projects.neoforged.net/neoforged/neoform
neo_form_version=1.21.1-20240808.144430
# The version of ParchmentMC that is used, see https://parchmentmc.org/docs/getting-started#choose-a-version for new versions
parchment_minecraft=1.21
parchment_version=2024.11.10

# Fabric
fabric_version=0.109.0+1.21.1
fabric_loader_version=0.16.9

# Forge
forge_version=52.0.28
forge_version_range=[52,)
forge_loader_version_range=[52,)

# NeoForge
neoforge_version=21.1.80
neoforge_version_range=[21.1,21.2)
neoforge_loader_version_range=[4,)

# Config. Cloth Config has a FORGE build at this version (15.0.140 covers 1.21 and 1.21.1 on all
# three loaders), so unlike the 1.21.11 port every loader gets a generated Cloth screen.
cloth_config_version=15.0.140
modmenu_version=11.0.4

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
