# Important Notes:
# fabric.mod.json's modid field cannot be expanded, you must change it manually.
# Every field you add must be added to buildSrc/src/main/groovy/multiloader-common.gradle expandProps map.

# Project
version=1.3.0
group=com.chillpavz.oredetector
java_version=17

# Common
minecraft_version=1.20.1
mod_name=Ore Detector Reborn
mod_author=restonic4
mod_id=oredetector
license=MIT
credits=Original Ore Detector mod by restonic4. Reborn/1.20.x port and expansion by chillpavz.
description=Craft handheld detectors and right-click a surface to scan for ore. \nOre Detector Reborn - an unofficial, updated port of restonic4's Ore Detector.
## One jar for 1.20 AND 1.20.1 (see ../CLAUDE.md "One jar for a whole patch line").
## The UPPER bound must stop below 1.20.2: that release rewrote networking and moved the data folders,
## and the template's default of [1.20.1, 1.22) would let this jar install as far as 1.21.x.
minecraft_version_range=[1.20, 1.20.2)
fabric_minecraft_version_range=>=1.20 <1.20.2
# The version of ParchmentMC that is used, see https://parchmentmc.org/docs/getting-started#choose-a-version for new versions
parchment_minecraft=1.20.1
parchment_version=2023.09.03

# Fabric
fabric_version=0.92.1+1.20.1
fabric_loader_version=0.16.9

# Forge
# Forge 46 = 1.20, 47 = 1.20.1, 48 = 1.20.2 - so [46,48) is exactly this jar's two versions.
# NeoForge's 1.20.1 builds are 47.1.x and still use the `forge` mod id, so they satisfy this range
# too; a Forge jar runs on NeoForge at this Minecraft version (Create ships one file for both).
forge_version=47.2.30
forge_version_range=[46,48)
forge_loader_version_range=[46,)

# Config. Cloth Config 11.1.136 ships one build per loader covering BOTH 1.20 and 1.20.1, on Fabric
# and Forge alike, so every loader gets the generated screen.
cloth_config_version=11.1.136
modmenu_version=7.2.2

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
